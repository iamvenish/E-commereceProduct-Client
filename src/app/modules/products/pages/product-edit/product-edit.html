<div class="edit-page-container">
  <div class="background-decor blur-1"></div>
  <div class="background-decor blur-2"></div>

  <div class="edit-card">
    @if (isLoading()) {
      <div class="form-loading-overlay">
        <div class="loader"></div>
        <p>Processing...</p>
      </div>
    }

    @if (errorMessage()) {
      <div class="error-alert">
        <span class="error-icon">⚠️</span>
        <div class="error-content">
          <h4>Something went wrong</h4>
          <p>{{ errorMessage() }}</p>
        </div>
        <button class="btn-close-error" (click)="errorMessage.set(null)">×</button>
      </div>
    }

    <div class="card-header">
      <button class="btn-back" (click)="goBack()">
        <span class="icon">←</span> Back
      </button>
      <h2>Edit <span>Product</span></h2>
      <p class="subtitle">Update the details of your premium item</p>
    </div>

    <form class="edit-form" [formGroup]="productInfo" (ngSubmit)="updateProduct()">
      <div class="input-grid">
        <div class="form-group">
          <label for="name">Product Name</label>
          <div class="input-wrapper">
            <span class="field-icon">📦</span>
            <input type="text" id="name" formControlName="productName" placeholder="Enter product name">
          </div>
        </div>

        <div class="form-group">
          <label for="price">Price (₹)</label>
          <div class="input-wrapper">
            <span class="field-icon">💰</span>
            <input type="number" id="price" formControlName="price" placeholder="0.00">
          </div>
        </div>

        <div class="form-group">
          <label for="rating">Rating (1-5)</label>
          <div class="input-wrapper">
            <span class="field-icon">⭐</span>
            <input type="number" id="rating" step="0.1" min="1" max="5" formControlName="rating">
          </div>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <div class="input-wrapper">
            <span class="field-icon">🏷️</span>
            <input type="text" id="category" formControlName="category" placeholder="e.g. Electronics">
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label for="imageUrl">Image URL</label>
        <div class="input-wrapper">
          <span class="field-icon">🖼️</span>
          <input type="text" id="imageUrl" formControlName="imageUrl" placeholder="https://example.com/image.jpg">
        </div>
      </div>

      <div class="form-group full-width">
        <label for="description">Description</label>
        <div class="input-wrapper">
          <textarea id="description" rows="4" formControlName="description" placeholder="Describe the product experience..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="goBack()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="isLoading() || productInfo.invalid">Save Changes</button>
      </div>
    </form>
  </div>
</div>
